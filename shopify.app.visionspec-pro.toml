client_id = "6b07c5cf80dfceefd108b40f33c4f375"
name = "visionspec-pro"
application_url = "https://visionspec.vercel.app"
embedded = true

[access_scopes]
scopes = "read_products,write_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ 
  "https://visionspec.vercel.app/auth/callback",
  "https://visionspec.vercel.app/auth/shopify/callback",
  "https://visionspec.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true